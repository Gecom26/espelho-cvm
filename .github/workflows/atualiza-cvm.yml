name: Espelho CVM

"on":
  workflow_dispatch: {}
  schedule: [{cron: "30 11 * * 1-5"}]

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Baixar e filtrar os dados da CVM
        run: python espelho_cvm.py
      - name: Publicar as atualizacoes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cotas/
          git diff --staged --quiet && echo "Nada mudou hoje." || (git commit -m "Espelho CVM: cotas atualizadas" && git push)
