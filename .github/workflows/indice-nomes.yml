name: Índice de nomes de empresas RS (base CNPJ da Receita)

# Gera o índice usado pela busca por NOME da Consulta CNPJ do D'AGILI FORCE.
# Roda toda terça às 06h (Brasília). Só reprocessa quando a Receita publica
# um mês novo; nas outras semanas termina em segundos.
# O arquivo grande vai como anexo da release "indice-nomes" (não pesa no
# repositório); só o pequeno indice/empresas_rs_info.json é commitado.
on:
  schedule:
    - cron: '0 9 * * 2'
  workflow_dispatch:
    inputs:
      forcar:
        description: 'Reprocessar mesmo que o mês já tenha sido gerado'
        type: boolean
        default: false
      uf:
        description: 'UF(s) do índice, separadas por vírgula'
        default: 'RS'
      sem_mei:
        description: 'Deixar MEI de fora (1 = sim, 0 = não)'
        default: '1'

permissions:
  contents: write

concurrency:
  group: indice-nomes
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gerar o índice de nomes
        id: gerar
        env:
          UF: ${{ github.event.inputs.uf || 'RS' }}
          SEM_MEI: ${{ github.event.inputs.sem_mei || '1' }}
        run: |
          python scripts/indice_nomes.py --saida indice/empresas_rs.txt.gz --info indice/empresas_rs_info.json \
            ${{ github.event.inputs.forcar == 'true' && '--forcar' || '' }} | tee saida.log
          if grep -q NADA_NOVO saida.log; then echo "novo=0" >> "$GITHUB_OUTPUT"; else echo "novo=1" >> "$GITHUB_OUTPUT"; fi

      - name: Publicar o índice na release "indice-nomes"
        if: steps.gerar.outputs.novo == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view indice-nomes >/dev/null 2>&1 || \
            gh release create indice-nomes --title "Índice de nomes de empresas (CNPJ)" \
              --notes "Arquivo usado pela busca por nome do D'AGILI FORCE. Atualizado automaticamente todo mês."
          gh release upload indice-nomes indice/empresas_rs.txt.gz --clobber

      - name: Commitar o resumo (referência e tamanho)
        if: steps.gerar.outputs.novo == '1'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indice/empresas_rs_info.json
          if git diff --cached --quiet; then
            echo "Sem alterações."
          else
            git commit -m "Índice de nomes RS: base CNPJ atualizada"
            git pull --rebase
            git push
          fi
